name: Sync upstream release

on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时检查一次
  workflow_dispatch:          # 手动触发按钮，方便测试

concurrency:
  group: sync-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载上游最新 release 产物并加版本号
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 格式：每行一个「上游仓库 目标目录 清单文件名 匹配模式」
          # （清单名默认 manifest.json；模式默认 "*.fpk *.spk"，多个用空格分隔）
          SOURCES: |
            luodaoyi/TAD6S4N10G-fnos app fnos.json *.fpk
            luodaoyi/TAD6S4N10G-fnos app synology.json *.spk
        run: |
          while read -r repo dir mname patterns; do
            [ -z "$repo" ] && continue
            mname=${mname:-manifest.json}
            [ -n "$patterns" ] || patterns='*.fpk *.spk'
            read -r tag pub <<< "$(gh api "repos/$repo/releases/latest" --jq '.tag_name + " " + .published_at')"
            echo ">> $repo 最新版本 $tag -> $dir/ ($mname: $patterns)"
            # 下载到临时目录再改名拷入，避免误改 app/ 里已有的历史版本文件
            tmp=$(mktemp -d)
            : > "$tmp/files.tsv"
            pats=()
            for g in $patterns; do pats+=(--pattern "$g"); done
            gh release download "$tag" --repo "$repo" --dir "$tmp" --clobber "${pats[@]}"
            mkdir -p "$dir"
            for g in $patterns; do
              for f in "$tmp"/$g; do
                [ -e "$f" ] || continue
                b="$(basename "$f")"
                case "$b" in
                  *"$tag"*) ;;  # 文件名已含版本号（如 tad-module-v1.0.2.spk），保持原名
                  *) b="$(basename "${f%.*}")-$tag.${f##*.}" ;;
                esac
                mv "$f" "$dir/$b"
                printf '%s\t%s\n' "$b" "$(stat -c%s "$dir/$b")" >> "$tmp/files.tsv"
              done
            done
            # 版本清单：发布页读它来生成本地下载链接，无需访问 GitHub API
            jq -R -s --arg repo "$repo" --arg tag "$tag" --arg pub "$pub" '
              (split("\n") | map(select(length>0)) | map(split("\t"))
                | map({key:.[0], value:(.[1]|tonumber)}) | from_entries) as $s
              | {repo:$repo, tag:$tag, published:$pub, generated:(now|todate),
                 files:($s|keys_unsorted), sizes:$s}
            ' < "$tmp/files.tsv" > "$dir/$mname"
            rm -rf "$tmp"
            echo "   $mname: $(cat "$dir/$mname")"
          done <<< "$SOURCES"

      - name: 有变化才提交推送
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app
          if git diff --cached --quiet; then
            echo "上游无更新，跳过"
            exit 0
          fi
          git commit -m "chore: sync latest release artifacts"
          # checkout 会用 GITHUB_TOKEN 设置 extraheader 且优先级高于 URL 里的凭据，先移除再用 PAT 推送
          git config --unset-all http.https://github.com/.extraheader
          git push "https://${SYNC_PAT}@github.com/WUDDC/release-page.git" main

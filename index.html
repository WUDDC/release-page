<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="TAD6S4N模块全平台发布页：支持 fnOS、群晖、Windows、Unraid 与 Linux，下载最新版本并查看更新日志。">
<link rel="icon" type="image/png" href="assets/logo.png">
<title>TAD6S4N模块 · 软件发布页</title>
<style>
/* ========== 主题变量（浅色 / 深色自适应） ========== */
:root{
  color-scheme: light;
  --bg:#f5f7fa;
  --surface:#ffffff;
  --surface-2:#edf1f6;
  --text:#1b2430;
  --text-2:#5b6a7d;
  --border:#e3e8ef;
  --border-strong:#cfd8e3;
  --brand:#3d7bff;
  --brand-2:#22b8ee;
  --brand-soft:rgba(61,123,255,.10);
  --blue-soft:rgba(61,123,255,.12);
  --green:#0e9f5f;
  --green-soft:rgba(16,185,129,.13);
  --orange:#c2620a;
  --orange-soft:rgba(245,158,11,.16);
  --shadow-card:0 1px 2px rgba(16,24,40,.05);
  --shadow-lift:0 14px 34px rgba(16,24,40,.12);
  --glow-1:rgba(61,123,255,.16);
  --glow-2:rgba(34,184,238,.15);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0e141f;
    --surface:#161e2c;
    --surface-2:#1e2839;
    --text:#e7edf6;
    --text-2:#90a1b7;
    --border:#26334a;
    --border-strong:#374865;
    --brand:#5c8dff;
    --brand-2:#2cc5f2;
    --brand-soft:rgba(92,141,255,.15);
    --blue-soft:rgba(92,141,255,.17);
    --green:#34d399;
    --green-soft:rgba(52,211,153,.15);
    --orange:#f5a623;
    --orange-soft:rgba(245,166,35,.16);
    --shadow-card:0 1px 2px rgba(0,0,0,.35);
    --shadow-lift:0 14px 34px rgba(0,0,0,.5);
    --glow-1:rgba(92,141,255,.14);
    --glow-2:rgba(44,197,242,.12);
  }
}

/* ========== 基础 ========== */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:clip; /* hero 光晕装饰层在窄屏下不产生横向滚动 */
}
main{flex:1}
a{color:inherit;text-decoration:none}
.icon{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}
.container{max-width:1060px;margin:0 auto;padding:0 24px;width:100%}
code{background:var(--surface-2);border-radius:6px;padding:1.5px 7px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

/* ========== 顶部导航 ========== */
.site-header{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.header-inner{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.2px}
.brand-logo{width:32px;height:32px;border-radius:9px;flex:none;display:block}
.header-nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.header-nav a{padding:7px 12px;border-radius:8px;color:var(--text-2);font-size:14px;transition:.15s}
.header-nav a:hover{color:var(--text);background:var(--surface-2)}

/* ========== 首页 Hero ========== */
.hero{padding:68px 0 36px;text-align:center;position:relative}
.hero::before{
  content:"";position:absolute;left:50%;top:-140px;transform:translateX(-50%);
  width:900px;height:480px;pointer-events:none;
  background:
    radial-gradient(420px 220px at 30% 40%,var(--glow-1),transparent 70%),
    radial-gradient(420px 220px at 70% 40%,var(--glow-2),transparent 70%);
}
.hero>*{position:relative}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px;border:1px solid var(--border);border-radius:999px;
  background:var(--surface);color:var(--text-2);font-size:13px;box-shadow:var(--shadow-card);
}
.eyebrow .icon{width:14px;height:14px;color:var(--brand)}
.hero h1{font-size:40px;line-height:1.3;letter-spacing:-.5px;margin:22px 0 12px}
.hero .lead{max-width:680px;margin:0 auto;color:var(--text-2);font-size:16.5px}
.hero-meta{margin-top:16px;font-size:13.5px;color:var(--text-2)}
.hero-meta b{color:var(--brand);font-weight:500}

/* ========== 平台选择 ========== */
.pick{padding:28px 0 76px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.section-head h2{font-size:22px;margin:0;letter-spacing:-.3px}
.section-head .sub{color:var(--text-2);font-size:14px}
.platform-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:14px}
.platform-card{
  position:relative;display:flex;flex-direction:column;gap:14px;
  padding:20px;background:var(--surface);
  border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-card);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.platform-card:hover{
  transform:translateY(-3px);
  border-color:color-mix(in srgb,var(--brand) 40%,var(--border));
  box-shadow:var(--shadow-lift);
}
.p-icon{
  width:46px;height:46px;border-radius:12px;flex:none;
  display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);
}
.p-icon .icon{width:24px;height:24px}
.p-icon.big{width:60px;height:60px;border-radius:16px}
.p-icon.big .icon{width:30px;height:30px}
.platform-card h3{margin:0;font-size:16px;line-height:1.4}
.p-sub{color:var(--text-2);font-size:13px;margin-top:1px}
.p-meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-2)}
.ver-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:999px;
  background:var(--surface-2);color:var(--text);
  font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums;
}
.ver-chip .icon{width:12.5px;height:12.5px;color:var(--brand)}
.p-arrow{
  position:absolute;top:18px;right:16px;color:var(--brand);
  opacity:0;transform:translateX(-4px);transition:.18s ease;
}
.p-arrow .icon{width:17px;height:17px}
.platform-card:hover .p-arrow,.platform-card:focus-visible .p-arrow{opacity:1;transform:translateX(0)}

/* ========== 平台下载页 ========== */
.back{
  display:inline-flex;align-items:center;gap:6px;
  margin:26px 0 18px;padding:6px 11px 6px 8px;border-radius:9px;
  color:var(--text-2);font-size:14px;transition:.15s;
}
.back:hover{color:var(--text);background:var(--surface-2)}
.plat-head{display:flex;gap:16px;align-items:center}
.plat-title{margin:0;font-size:28px;letter-spacing:-.4px;line-height:1.3}
.plat-title:focus{outline:none}
.plat-desc{margin:4px 0 0;color:var(--text-2);font-size:14.5px}

.download-card{
  margin-top:26px;padding:30px;
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  box-shadow:var(--shadow-card);
}
.rel-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ver-big{font-size:27px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.rel-date{color:var(--text-2);font-size:14px}
.badge-latest{
  display:inline-flex;align-items:center;
  padding:3px 11px;border-radius:999px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;font-size:12px;font-weight:500;letter-spacing:.3px;
}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:48px;padding:0 24px;border-radius:12px;
  font-size:15px;font-weight:500;font-family:inherit;
  border:1px solid transparent;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease,background .15s ease,border-color .15s ease;
  flex:1 1 220px;
}
.btn .icon{width:18px;height:18px}
.btn-primary{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;box-shadow:0 8px 20px var(--blue-soft);
}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 10px 24px var(--blue-soft)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-secondary:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn-sm{height:36px;padding:0 16px;font-size:13.5px;border-radius:10px;flex:none}
.btn-sm .icon{width:15px;height:15px}
.file-line{
  margin-top:16px;color:var(--text-2);font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  word-break:break-all;
}
.assets{margin-top:22px;padding-top:18px;border-top:1px dashed var(--border)}
.assets h4{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--text-2)}
.asset-row{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 14px;margin-bottom:9px;
  border:1px solid var(--border);border-radius:13px;
  transition:border-color .15s;
}
.asset-row:hover{border-color:var(--border-strong)}
.asset-row>div:first-child{flex:1 1 260px;min-width:0}
.a-name{font-size:13px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}
.a-meta{color:var(--text-2);font-size:12.5px;margin-top:2px}
.install-tip{
  display:flex;gap:10px;align-items:flex-start;
  margin-top:22px;padding:13px 16px;border-radius:13px;
  background:var(--brand-soft);color:var(--text);font-size:13.5px;line-height:1.7;
}
.install-tip .icon{width:17px;height:17px;color:var(--brand);margin-top:3px;flex:none}

/* ========== 更新日志 ========== */
.changelog{margin:56px 0 84px;scroll-margin-top:84px;border-radius:16px}
.changelog.flash{animation:flashBg 1.1s ease}
@keyframes flashBg{0%{background:var(--brand-soft)}100%{background:transparent}}
.changelog h2{margin:0;font-size:22px;letter-spacing:-.3px}
.ch-sub{margin:6px 0 26px;color:var(--text-2);font-size:14px}
.timeline{position:relative;padding-left:30px}
.timeline::before{
  content:"";position:absolute;left:8px;top:8px;bottom:14px;width:2px;
  background:var(--border);border-radius:2px;
}
.release{position:relative;padding:0 0 34px}
.release:last-child{padding-bottom:4px}
.release::before{
  content:"";position:absolute;left:-28px;top:7px;
  width:14px;height:14px;border-radius:50%;
  background:var(--surface);border:2.5px solid var(--brand);
}
.release.old::before{border-color:var(--border-strong)}
.release.latest::before{background:var(--brand)}
.rel-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.rel-head .v{font-weight:600;font-size:17.5px;font-variant-numeric:tabular-nums}
.rel-head .rel-date{font-size:13.5px}
.group{margin-top:13px}
.group-tag{
  display:inline-flex;align-items:center;
  padding:2px 10px;border-radius:7px;
  font-size:12px;font-weight:500;
}
.tag-new{color:var(--green);background:var(--green-soft)}
.tag-imp{color:var(--brand);background:var(--blue-soft)}
.tag-fix{color:var(--orange);background:var(--orange-soft)}
.group ul{margin:9px 0 0;padding:0;list-style:none}
.group li{position:relative;padding:3px 0 3px 17px;font-size:14.5px}
.group li::before{
  content:"";position:absolute;left:3px;top:13px;
  width:5px;height:5px;border-radius:50%;background:var(--border-strong);
}

/* ========== GitHub 数据来源与 Markdown 日志 ========== */
.src-note{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--text-2)}
.src-note .icon{width:14px;height:14px;flex:none}
.src-note a{color:var(--brand)}
.rel-link{font-size:12.5px;color:var(--brand);font-weight:400}
.md{margin-top:4px}
.md h3,.md h4,.md h5,.md h6{margin:18px 0 6px;font-size:15px;letter-spacing:0}
.md h3{font-size:16px}
.md p{margin:8px 0;font-size:14.5px}
.md ul,.md ol{margin:8px 0;padding-left:22px}
.md li{margin:4px 0;font-size:14.5px}
.md a{color:var(--brand)}
.md pre{background:var(--surface-2);border-radius:10px;padding:12px 14px;overflow:auto;margin:10px 0}
.md pre code{background:none;padding:0}

/* ========== 页脚 ========== */
.site-footer{border-top:1px solid var(--border);padding:26px 0;background:var(--surface)}
.footer-inner{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px 24px;flex-wrap:wrap;color:var(--text-2);font-size:13.5px;
}
.footer-links{display:flex;gap:4px;flex-wrap:wrap}
.footer-links a{padding:5px 10px;border-radius:8px}
.footer-links a:hover{color:var(--text);background:var(--surface-2)}

/* ========== 视图切换动画 ========== */
.view{animation:viewIn .28s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ========== 响应式 ========== */
@media (max-width:640px){
  .hero{padding:44px 0 24px}
  .hero h1{font-size:29px}
  .hero .lead{font-size:15px}
  .download-card{padding:22px 18px}
  .plat-title{font-size:23px}
  .ver-big{font-size:23px}
  .actions .btn{flex:1 1 100%}
  .btn{flex-basis:auto}
  .asset-row .btn-sm{width:100%}
  .header-nav{display:none}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

/* ===================== GitHub Releases 动态数据 ===================== */
/* 每个平台的数据状态：内置数据先行渲染，GitHub 拉取成功后整体替换 */
const GH_TTL = 10 * 60 * 1000;
const state = {};
function stOf(p){
  if(!state[p.id]) state[p.id] = { latest: p.latest, changelog: p.changelog, changelogSrc: "static", loading: false, error: false };
  return state[p.id];
}
PLATFORMS.forEach(stOf);

function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return "";
  const pad = function(n){ return String(n).padStart(2, "0"); };
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function humanSize(bytes){
  if(!Number.isFinite(bytes) || bytes <= 0) return "";
  if(bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + " GB";
  if(bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
  return Math.max(1, Math.round(bytes / 1024)) + " KB";
}
function tagVer(tag){ return String(tag || "").replace(/^v/i, ""); }

/* localStorage 缓存：10 分钟内不重复请求；请求失败时允许用过期缓存兜底 */
function cacheGet(key, allowStale){
  try{
    const v = JSON.parse(localStorage.getItem("ghrel:" + key));
    if(!v) return null;
    if(Date.now() - v.t < GH_TTL) return { fresh: true, data: v.d };
    return allowStale ? { fresh: false, data: v.d } : null;
  }catch(e){ return null; }
}
function cacheSet(key, data){
  try{ localStorage.setItem("ghrel:" + key, JSON.stringify({ t: Date.now(), d: data })); }catch(e){}
}
async function ghApi(path, key){
  const hit = cacheGet(key, true);
  if(hit && hit.fresh) return hit.data;
  try{
    const res = await fetch("https://api.github.com" + path, {
      headers: { "Accept": "application/vnd.github+json" },
      signal: AbortSignal.timeout(8000)
    });
    if(!res.ok) throw new Error("GitHub API HTTP " + res.status);
    const data = await res.json();
    cacheSet(key, data);
    return data;
  }catch(e){
    if(hit) return hit.data;
    throw e;
  }
}

/* 把仓库 Release 数据归一化为页面使用的结构；prefer 命中的附件排最前（作为主下载） */
function normLatest(rel, p){
  const excl = p.exclude ? new RegExp(p.exclude, "i") : null;
  let assets = (rel.assets || [])
    .filter(function(a){ return !/\.sha256$|\.sha2$|\.sig$|\.asc$/i.test(a.name); })
    .filter(function(a){ return !(excl && excl.test(a.name)); })
    .map(function(a){ return { label: a.name, file: a.name, arch: "", size: humanSize(a.size), url: a.browser_download_url }; });
  const preferRe = p.prefer ? new RegExp(p.prefer, "i") : null;
  if(preferRe){
    assets.sort(function(a, b){ return (preferRe.test(b.file) ? 1 : 0) - (preferRe.test(a.file) ? 1 : 0); });
  }
  return { version: tagVer(rel.tag_name), date: fmtDate(rel.published_at), assets: assets };
}
function normRelease(r){
  return { version: tagVer(r.tag_name), date: fmtDate(r.published_at), body: r.body || "", url: r.html_url || "" };
}

/* 轻量 Markdown 渲染（零依赖）：内容先整体转义再生成白名单标签，防 XSS */
function mdInline(t){
  const codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){ codes.push(c); return "\x00" + (codes.length - 1) + "\x00"; });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/\x00(\d+)\x00/g, function(_, i){ return "<code>" + codes[+i] + "</code>"; });
  return t;
}
function mdToHtml(src){
  const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
  let html = "", para = [], list = null, ordered = false, code = null;
  const flushP = function(){
    if(para.length){ html += "<p>" + para.map(mdInline).join("<br>") + "</p>"; para = []; }
  };
  const flushL = function(){
    if(list){
      const tag = ordered ? "ol" : "ul";
      html += "<" + tag + ">" + list.map(function(li){ return "<li>" + mdInline(li) + "</li>"; }).join("") + "</" + tag + ">";
      list = null;
    }
  };
  for(const raw of lines){
    const line = raw.replace(/\s+$/, "");
    if(code !== null){
      if(/^```/.test(line)){ html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>"; code = null; }
      else code.push(raw);
      continue;
    }
    if(/^```/.test(line)){ flushP(); flushL(); code = []; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)/);
    if(h){ flushP(); flushL(); const tag = "h" + Math.min(h[1].length + 2, 6); html += "<" + tag + ">" + mdInline(esc(h[2])) + "</" + tag + ">"; continue; }
    const ul = line.match(/^\s*[-*+]\s+(.*)/);
    if(ul){ flushP(); if(list && ordered) flushL(); if(!list){ list = []; ordered = false; } list.push(esc(ul[1])); continue; }
    const ol = line.match(/^\s*\d+[.、)]\s+(.*)/);
    if(ol){ flushP(); if(list && !ordered) flushL(); if(!list){ list = []; ordered = true; } list.push(esc(ol[1])); continue; }
    if(!line.trim()){ flushP(); flushL(); continue; }
    flushL(); para.push(esc(line));
  }
  if(code !== null) html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>";
  flushP(); flushL();
  return html;
}

/* 同步：latest 用于首页卡片；Releases 列表用于平台页更新日志（保留 body 原文渲染） */
let current = { view: "home", id: null };
function repaint(preserveScroll){
  const y = window.scrollY;
  if(current.view === "home"){
    renderHome();
  }else{
    const p = PLATFORMS.find(function(x){ return x.id === current.id; });
    if(p){
      paintPlatform(p);
      if(preserveScroll) window.scrollTo({ top: y, behavior: "auto" });
    }
  }
}
async function syncLatest(p){
  try{
    const rel = await ghApi("/repos/" + p.repo + "/releases/latest", "latest:" + p.repo);
    if(rel && rel.tag_name){
      const st = stOf(p);
      st.latest = normLatest(rel, p);
      st.error = false;
    }
    repaint(false);
  }catch(e){
    stOf(p).error = true;
    if(current.view === "platform" && current.id === p.id) repaint(true);
  }
}
async function syncReleases(p){
  const st = stOf(p);
  if(st.loading || st.changelogSrc === "github") return;
  st.loading = true;
  repaint(true);
  try{
    const list = await ghApi("/repos/" + p.repo + "/releases?per_page=20", "releases:" + p.repo);
    if(Array.isArray(list) && list.length){
      st.changelog = list.map(normRelease);
      if(list[0].tag_name) st.latest = normLatest(list[0], p);
      st.changelogSrc = "github";
      st.error = false;
    }
  }catch(e){
    st.error = true;
  }
  st.loading = false;
  repaint(true);
}

/* 更新日志条目：GitHub 数据带 body（Markdown 正文），内置数据按分组渲染 */
function releaseHTML(r, i){
  let detail;
  if(r.body != null){
    detail = '<div class="md">' + mdToHtml(r.body) + "</div>";
  }else{
    const groups = [
      ["new", "新增", r.new || []],
      ["imp", "优化", r.imp || []],
      ["fix", "修复", r.fix || []]
    ].filter(function(g){ return g[2].length > 0; });
    detail = groups.map(function(g){
      return '<div class="group"><span class="group-tag tag-' + g[0] + '">' + g[1] + "</span><ul>" +
        g[2].map(function(t){ return "<li>" + t + "</li>"; }).join("") +
        "</ul></div>";
    }).join("");
  }
  return '<div class="release ' + (i === 0 ? "latest" : "old") + '">' +
      '<div class="rel-head"><span class="v">v' + esc(r.version) + "</span>" +
      (i === 0 ? '<span class="badge-latest">最新</span>' : "") +
      '<span class="rel-date">' + esc(r.date) + "</span>" +
      (r.url ? '<a class="rel-link" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">GitHub ↗</a>' : "") +
      "</div>" + detail +
    "</div>";
}

        '<div class="rel-meta"><span class="ver-big">v' + esc(l.version) + '</span><span class="badge-latest">最新版本</span><span class="rel-date">' + esc(l.date) + " 发布</span></div>" +
        '<div class="actions">' +
          "<a class='btn btn-primary' " + dlAttrs(main ? main.url : "#") + ">" + icon("download") + "下载 " + esc(main ? main.label : "安装包") + "</a>" +
          '<button class="btn btn-secondary" type="button" data-goto-log>' + icon("history") + "查看更新日志</button>" +
        "</div>" +
        (fileLine ? '<div class="file-line">' + esc(fileLine) + "</div>" : "") +
        (rest.length > 0
          ? '<div class="assets"><h4>其他格式 / 架构</h4>' + rest.map(function(a){
              const meta = [a.label !== a.file ? a.label : "", a.arch, a.size].filter(Boolean).join(" · ");
              return '<div class="asset-row"><div><div class="a-name">' + esc(a.file) + '</div><div class="a-meta">' + esc(meta) + "</div></div>" +
                "<a class='btn btn-sm btn-secondary' " + dlAttrs(a.url) + ">" + icon("download") + "下载</a></div>";
            }).join("") + "</div>"
          : "") +
        '<div class="install-tip">' + icon("info") + "<div><b>安装说明：</b>" + p.tip + "</div></div>" +
      "</div>" +
      '<div class="changelog" id="changelog-section">' +
        "<h2>更新日志</h2>" +
        '<p class="ch-sub">' + chSub + "</p>" +
        srcNote +
        '<div class="timeline">' + st.changelog.map(releaseHTML).join("") + "</div>" +
      "</div>" +
    "</div>";
}

/* 视图切换 */
const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function showHome(){
  current = { view: "home", id: null };
  document.getElementById("view-platform").hidden = true;
  document.getElementById("view-home").hidden = false;
  document.title = SITE.title;
  window.scrollTo({ top: 0, behavior: "auto" });
}
function showPlatform(p){
  current = { view: "platform", id: p.id };
  paintPlatform(p);
  document.getElementById("view-home").hidden = true;
  document.getElementById("view-platform").hidden = false;
  document.title = p.name + "下载 · " + SITE.productName;
  window.scrollTo({ top: 0, behavior: "auto" });
  if(p.repo) syncReleases(p);
}

/* 路由：#/ 为首页，#/platform/<id> 为对应平台下载页 */
function route(){
  const m = location.hash.match(/^#\/platform\/([\w-]+)/);
  const p = m && PLATFORMS.find(function(x){ return x.id === m[1]; });
  if(p) showPlatform(p); else showHome();
}
window.addEventListener("hashchange", route);

/* 全局点击：占位链接（href="#"）不跳转；"查看更新日志"平滑滚动并高亮 */
document.addEventListener("click", function(e){
  const logBtn = e.target.closest("[data-goto-log]");
  if(logBtn){
    const section = document.getElementById("changelog-section");
    section.scrollIntoView({ behavior: prefersReduced ? "auto" : "smooth", block: "start" });
    section.classList.remove("flash");
    void section.offsetWidth; /* 重新触发动画 */
    section.classList.add("flash");
    return;
  }
  const a = e.target.closest("a");
  if(a && a.getAttribute("href") === "#") e.preventDefault();
});

/* 启动：先用内置数据渲染，再异步同步各平台的 GitHub Releases */
renderHome();
route();
PLATFORMS.forEach(function(p){ if(p.repo) syncLatest(p); });
</script>
</body>
</html>

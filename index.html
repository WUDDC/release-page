<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="云枢全平台发布页：支持 fnOS、群晖、Windows、Unraid 与 Linux，下载最新版本并查看更新日志。">
<title>云枢 · 软件发布页</title>
<style>
/* ========== 主题变量（浅色 / 深色自适应） ========== */
:root{
  color-scheme: light;
  --bg:#f5f7fa;
  --surface:#ffffff;
  --surface-2:#edf1f6;
  --text:#1b2430;
  --text-2:#5b6a7d;
  --border:#e3e8ef;
  --border-strong:#cfd8e3;
  --brand:#3d7bff;
  --brand-2:#22b8ee;
  --brand-soft:rgba(61,123,255,.10);
  --blue-soft:rgba(61,123,255,.12);
  --green:#0e9f5f;
  --green-soft:rgba(16,185,129,.13);
  --orange:#c2620a;
  --orange-soft:rgba(245,158,11,.16);
  --shadow-card:0 1px 2px rgba(16,24,40,.05);
  --shadow-lift:0 14px 34px rgba(16,24,40,.12);
  --glow-1:rgba(61,123,255,.16);
  --glow-2:rgba(34,184,238,.15);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0e141f;
    --surface:#161e2c;
    --surface-2:#1e2839;
    --text:#e7edf6;
    --text-2:#90a1b7;
    --border:#26334a;
    --border-strong:#374865;
    --brand:#5c8dff;
    --brand-2:#2cc5f2;
    --brand-soft:rgba(92,141,255,.15);
    --blue-soft:rgba(92,141,255,.17);
    --green:#34d399;
    --green-soft:rgba(52,211,153,.15);
    --orange:#f5a623;
    --orange-soft:rgba(245,166,35,.16);
    --shadow-card:0 1px 2px rgba(0,0,0,.35);
    --shadow-lift:0 14px 34px rgba(0,0,0,.5);
    --glow-1:rgba(92,141,255,.14);
    --glow-2:rgba(44,197,242,.12);
  }
}

/* ========== 基础 ========== */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:clip; /* hero 光晕装饰层在窄屏下不产生横向滚动 */
}
main{flex:1}
a{color:inherit;text-decoration:none}
.icon{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}
.container{max-width:1060px;margin:0 auto;padding:0 24px;width:100%}
code{background:var(--surface-2);border-radius:6px;padding:1.5px 7px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

/* ========== 顶部导航 ========== */
.site-header{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.header-inner{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.2px}
.brand-mark{
  width:32px;height:32px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:grid;place-items:center;color:#fff;
}
.brand-mark .icon{width:18px;height:18px}
.header-nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.header-nav a{padding:7px 12px;border-radius:8px;color:var(--text-2);font-size:14px;transition:.15s}
.header-nav a:hover{color:var(--text);background:var(--surface-2)}

/* ========== 首页 Hero ========== */
.hero{padding:68px 0 36px;text-align:center;position:relative}
.hero::before{
  content:"";position:absolute;left:50%;top:-140px;transform:translateX(-50%);
  width:900px;height:480px;pointer-events:none;
  background:
    radial-gradient(420px 220px at 30% 40%,var(--glow-1),transparent 70%),
    radial-gradient(420px 220px at 70% 40%,var(--glow-2),transparent 70%);
}
.hero>*{position:relative}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px;border:1px solid var(--border);border-radius:999px;
  background:var(--surface);color:var(--text-2);font-size:13px;box-shadow:var(--shadow-card);
}
.eyebrow .icon{width:14px;height:14px;color:var(--brand)}
.hero h1{font-size:40px;line-height:1.3;letter-spacing:-.5px;margin:22px 0 12px}
.hero .lead{max-width:680px;margin:0 auto;color:var(--text-2);font-size:16.5px}
.hero-meta{margin-top:16px;font-size:13.5px;color:var(--text-2)}
.hero-meta b{color:var(--brand);font-weight:500}

/* ========== 平台选择 ========== */
.pick{padding:28px 0 76px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.section-head h2{font-size:22px;margin:0;letter-spacing:-.3px}
.section-head .sub{color:var(--text-2);font-size:14px}
.platform-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:14px}
.platform-card{
  position:relative;display:flex;flex-direction:column;gap:14px;
  padding:20px;background:var(--surface);
  border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-card);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.platform-card:hover{
  transform:translateY(-3px);
  border-color:color-mix(in srgb,var(--brand) 40%,var(--border));
  box-shadow:var(--shadow-lift);
}
.p-icon{
  width:46px;height:46px;border-radius:12px;flex:none;
  display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);
}
.p-icon .icon{width:24px;height:24px}
.p-icon.big{width:60px;height:60px;border-radius:16px}
.p-icon.big .icon{width:30px;height:30px}
.platform-card h3{margin:0;font-size:16px;line-height:1.4}
.p-sub{color:var(--text-2);font-size:13px;margin-top:1px}
.p-meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-2)}
.ver-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:999px;
  background:var(--surface-2);color:var(--text);
  font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums;
}
.ver-chip .icon{width:12.5px;height:12.5px;color:var(--brand)}
.p-arrow{
  position:absolute;top:18px;right:16px;color:var(--brand);
  opacity:0;transform:translateX(-4px);transition:.18s ease;
}
.p-arrow .icon{width:17px;height:17px}
.platform-card:hover .p-arrow,.platform-card:focus-visible .p-arrow{opacity:1;transform:translateX(0)}

/* ========== 平台下载页 ========== */
.back{
  display:inline-flex;align-items:center;gap:6px;
  margin:26px 0 18px;padding:6px 11px 6px 8px;border-radius:9px;
  color:var(--text-2);font-size:14px;transition:.15s;
}
.back:hover{color:var(--text);background:var(--surface-2)}
.plat-head{display:flex;gap:16px;align-items:center}
.plat-title{margin:0;font-size:28px;letter-spacing:-.4px;line-height:1.3}
.plat-title:focus{outline:none}
.plat-desc{margin:4px 0 0;color:var(--text-2);font-size:14.5px}

.download-card{
  margin-top:26px;padding:30px;
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  box-shadow:var(--shadow-card);
}
.rel-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ver-big{font-size:27px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.rel-date{color:var(--text-2);font-size:14px}
.badge-latest{
  display:inline-flex;align-items:center;
  padding:3px 11px;border-radius:999px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;font-size:12px;font-weight:500;letter-spacing:.3px;
}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:48px;padding:0 24px;border-radius:12px;
  font-size:15px;font-weight:500;font-family:inherit;
  border:1px solid transparent;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease,background .15s ease,border-color .15s ease;
  flex:1 1 220px;
}
.btn .icon{width:18px;height:18px}
.btn-primary{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;box-shadow:0 8px 20px var(--blue-soft);
}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 10px 24px var(--blue-soft)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-secondary:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn-sm{height:36px;padding:0 16px;font-size:13.5px;border-radius:10px;flex:none}
.btn-sm .icon{width:15px;height:15px}
.file-line{
  margin-top:16px;color:var(--text-2);font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  word-break:break-all;
}
.assets{margin-top:22px;padding-top:18px;border-top:1px dashed var(--border)}
.assets h4{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--text-2)}
.asset-row{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 14px;margin-bottom:9px;
  border:1px solid var(--border);border-radius:13px;
  transition:border-color .15s;
}
.asset-row:hover{border-color:var(--border-strong)}
.asset-row>div:first-child{flex:1 1 260px;min-width:0}
.a-name{font-size:13px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}
.a-meta{color:var(--text-2);font-size:12.5px;margin-top:2px}
.install-tip{
  display:flex;gap:10px;align-items:flex-start;
  margin-top:22px;padding:13px 16px;border-radius:13px;
  background:var(--brand-soft);color:var(--text);font-size:13.5px;line-height:1.7;
}
.install-tip .icon{width:17px;height:17px;color:var(--brand);margin-top:3px;flex:none}

/* ========== 更新日志 ========== */
.changelog{margin:56px 0 84px;scroll-margin-top:84px;border-radius:16px}
.changelog.flash{animation:flashBg 1.1s ease}
@keyframes flashBg{0%{background:var(--brand-soft)}100%{background:transparent}}
.changelog h2{margin:0;font-size:22px;letter-spacing:-.3px}
.ch-sub{margin:6px 0 26px;color:var(--text-2);font-size:14px}
.timeline{position:relative;padding-left:30px}
.timeline::before{
  content:"";position:absolute;left:8px;top:8px;bottom:14px;width:2px;
  background:var(--border);border-radius:2px;
}
.release{position:relative;padding:0 0 34px}
.release:last-child{padding-bottom:4px}
.release::before{
  content:"";position:absolute;left:-28px;top:7px;
  width:14px;height:14px;border-radius:50%;
  background:var(--surface);border:2.5px solid var(--brand);
}
.release.old::before{border-color:var(--border-strong)}
.release.latest::before{background:var(--brand)}
.rel-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.rel-head .v{font-weight:600;font-size:17.5px;font-variant-numeric:tabular-nums}
.rel-head .rel-date{font-size:13.5px}
.group{margin-top:13px}
.group-tag{
  display:inline-flex;align-items:center;
  padding:2px 10px;border-radius:7px;
  font-size:12px;font-weight:500;
}
.tag-new{color:var(--green);background:var(--green-soft)}
.tag-imp{color:var(--brand);background:var(--blue-soft)}
.tag-fix{color:var(--orange);background:var(--orange-soft)}
.group ul{margin:9px 0 0;padding:0;list-style:none}
.group li{position:relative;padding:3px 0 3px 17px;font-size:14.5px}
.group li::before{
  content:"";position:absolute;left:3px;top:13px;
  width:5px;height:5px;border-radius:50%;background:var(--border-strong);
}

/* ========== 页脚 ========== */
.site-footer{border-top:1px solid var(--border);padding:26px 0;background:var(--surface)}
.footer-inner{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px 24px;flex-wrap:wrap;color:var(--text-2);font-size:13.5px;
}
.footer-links{display:flex;gap:4px;flex-wrap:wrap}
.footer-links a{padding:5px 10px;border-radius:8px}
.footer-links a:hover{color:var(--text);background:var(--surface-2)}

/* ========== 视图切换动画 ========== */
.view{animation:viewIn .28s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ========== 响应式 ========== */
@media (max-width:640px){
  .hero{padding:44px 0 24px}
  .hero h1{font-size:29px}
  .hero .lead{font-size:15px}
  .download-card{padding:22px 18px}
  .plat-title{font-size:23px}
  .ver-big{font-size:23px}
  .actions .btn{flex:1 1 100%}
  .btn{flex-basis:auto}
  .asset-row .btn-sm{width:100%}
  .header-nav{display:none}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

/* ===================== 以下为页面逻辑，一般无需修改 ===================== */

  drive: '<line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/>',
  server: '<rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><line x1="6" y1="7" x2="6.01" y2="7"/><line x1="6" y1="17" x2="6.01" y2="17"/>',
  windows: '<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/>',
  rack: '<rect x="3" y="3" width="18" height="5" rx="1"/><rect x="3" y="10" width="18" height="5" rx="1"/><rect x="3" y="17" width="18" height="4" rx="1"/><line x1="7" y1="5.5" x2="7.01" y2="5.5"/><line x1="7" y1="12.5" x2="7.01" y2="12.5"/><line x1="7" y1="19" x2="7.01" y2="19"/>',
  terminal: '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="3" x2="12" y2="15"/>',
  history: '<path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/><polyline points="12 7 12 12 15 15"/>',
  back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  info: '<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  arrow: '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>'
};
function icon(name){
  return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
}
/* 静态占位图标（data-icon） */
document.querySelectorAll("[data-icon]").forEach(el => {
  el.outerHTML = icon(el.getAttribute("data-icon"));
});

/* 品牌与文案 */
document.getElementById("brand-mark").innerHTML = icon("drive");
document.getElementById("brand-name").textContent = SITE.productName;
document.title = SITE.title;

/* 首页：平台卡片 */
function renderHome(){
  document.getElementById("platform-grid").innerHTML = PLATFORMS.map(function(p){
    const a = p.latest.assets[0];
    return '<a class="platform-card" href="#/platform/' + p.id + '" aria-label="进入' + p.name + '下载页，最新版本 v' + p.latest.version + '">' +
        '<span class="p-arrow">' + icon("arrow") + "</span>" +
        '<span class="p-icon">' + icon(p.icon) + "</span>" +
        "<span><h3>" + p.name + "</h3><span class='p-sub'>" + p.sub + "</span></span>" +
        '<span class="p-meta"><span class="ver-chip">' + icon("download") + "v" + p.latest.version + "</span><span>" + a.size + "</span></span>" +
      "</a>";
  }).join("");

  /* 顶部“最新发布”摘要：取全平台日期最新的一条 */
  let newest = PLATFORMS[0];
  PLATFORMS.forEach(function(p){
    if (new Date(p.latest.date) > new Date(newest.latest.date)) newest = p;
  });
  document.getElementById("hero-meta").innerHTML =
    "最新发布 <b>v" + newest.latest.version + "</b> · " + newest.latest.date + " · 覆盖 " + PLATFORMS.length + " 个平台";
}

/* 更新日志条目 */
function releaseHTML(r, i){
  const groups = [
    ["new", "新增", r.new || []],
    ["imp", "优化", r.imp || []],
    ["fix", "修复", r.fix || []]
  ].filter(function(g){ return g[2].length > 0; });
  return '<div class="release ' + (i === 0 ? "latest" : "old") + '">' +
      '<div class="rel-head"><span class="v">v' + r.version + "</span>" +
      (i === 0 ? '<span class="badge-latest">最新</span>' : "") +
      '<span class="rel-date">' + r.date + "</span></div>" +
      groups.map(function(g){
        return '<div class="group"><span class="group-tag tag-' + g[0] + '">' + g[1] + "</span><ul>" +
          g[2].map(function(t){ return "<li>" + t + "</li>"; }).join("") +
          "</ul></div>";
      }).join("") +
    "</div>";
}

/* 下载链接：占位地址（#）时拦截跳转 */
function dlAttrs(url){
  return 'href="' + url + '"' + (url === "#" ? ' data-stub' : "");
}

/* 平台下载页 */
function renderPlatform(p){
  const l = p.latest;
  const main = l.assets[0];
  const rest = l.assets.slice(1);
  document.getElementById("view-platform").innerHTML =
    '<div class="container">' +
      '<a class="back" href="#/">' + icon("back") + "返回选择平台</a>" +
      '<div class="plat-head">' +
        '<span class="p-icon big">' + icon(p.icon) + "</span>" +
        "<div><h1 class='plat-title' tabindex='-1'>" + p.name + "</h1>" +
        '<p class="plat-desc">' + p.desc + "</p></div>" +
      "</div>" +
      '<div class="download-card">' +
        '<div class="rel-meta"><span class="ver-big">v' + l.version + '</span><span class="badge-latest">最新版本</span><span class="rel-date">' + l.date + " 发布</span></div>" +
        '<div class="actions">' +
          "<a class='btn btn-primary' " + dlAttrs(main.url) + ">" + icon("download") + "下载 " + main.label + "</a>" +
          '<button class="btn btn-secondary" type="button" data-goto-log>' + icon("history") + "查看更新日志</button>" +
        "</div>" +
        '<div class="file-line">' + main.file + " · " + main.arch + " · " + main.size + "</div>" +
        (rest.length > 0
          ? '<div class="assets"><h4>其他格式 / 架构</h4>' + rest.map(function(a){
              return '<div class="asset-row"><div><div class="a-name">' + a.file + '</div><div class="a-meta">' + a.label + " · " + a.arch + " · " + a.size + "</div></div>" +
                "<a class='btn btn-sm btn-secondary' " + dlAttrs(a.url) + ">" + icon("download") + "下载</a></div>";
            }).join("") + "</div>"
          : "") +
        '<div class="install-tip">' + icon("info") + "<div><b>安装说明：</b>" + p.tip + "</div></div>" +
      "</div>" +
      '<div class="changelog" id="changelog-section">' +
        "<h2>更新日志</h2>" +
        '<p class="ch-sub">以下为' + p.name + "的历史版本记录，新版本在上</p>" +
        '<div class="timeline">' + p.changelog.map(releaseHTML).join("") + "</div>" +
      "</div>" +
    "</div>";
}

/* 视图切换 */
const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function showHome(){
  document.getElementById("view-platform").hidden = true;
  document.getElementById("view-home").hidden = false;
  document.title = SITE.title;
  window.scrollTo({ top: 0, behavior: "auto" });
}
function showPlatform(p){
  renderPlatform(p);
  document.getElementById("view-home").hidden = true;
  const view = document.getElementById("view-platform");
  view.hidden = false;
  document.title = p.name + "下载 · " + SITE.productName;
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* 路由：#/ 为首页，#/platform/<id> 为对应平台下载页 */
function route(){
  const m = location.hash.match(/^#\/platform\/([\w-]+)/);
  const p = m && PLATFORMS.find(function(x){ return x.id === m[1]; });
  if (p) showPlatform(p); else showHome();
}
window.addEventListener("hashchange", route);

/* 全局点击：占位链接（href="#"）不跳转；“查看更新日志”平滑滚动并高亮 */
document.addEventListener("click", function(e){
  const logBtn = e.target.closest("[data-goto-log]");
  if (logBtn){
    const section = document.getElementById("changelog-section");
    section.scrollIntoView({ behavior: prefersReduced ? "auto" : "smooth", block: "start" });
    section.classList.remove("flash");
    void section.offsetWidth; /* 重新触发动画 */
    section.classList.add("flash");
    return;
  }
  const a = e.target.closest("a");
  if (a && a.getAttribute("href") === "#") e.preventDefault();
});

renderHome();
route();
</script>
